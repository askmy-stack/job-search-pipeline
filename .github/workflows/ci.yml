name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Avoid stacking cancelled/failed checks when Actions is degraded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-pipeline:
    name: Verify pipeline (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # verify-pipeline.mjs is stdlib-only. Playwright is only needed for generate-pdf.mjs.
      - name: Run verify-pipeline.mjs
        run: node verify-pipeline.mjs

  go-test:
    name: Go test (dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: dashboard/go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
